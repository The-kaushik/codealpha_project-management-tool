<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseFlow - Collaborative Agile Project Management & Team Workspace</title>
  <meta name="description" content="State-of-the-art collaborative project management tool. Create group projects, assign tasks, manage kanban boards, timeline gantt, burndown charts, and communicate with your team.">
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/task-modal.css">
</head>
<body>

  <div class="app-container">
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar" id="app-sidebar">
      <!-- Sidebar Header -->
      <div class="sidebar-header">
        <div class="brand" id="brand-home" title="PulseFlow Workspace">
          <img src="assets/logo.jpg" alt="PulseFlow Logo" class="brand-logo">
          <div class="brand-text">
            <h1>PulseFlow</h1>
            <span>Team Workspace</span>
          </div>
        </div>
      </div>

      <!-- Sidebar Content -->
      <div class="sidebar-content">
        <!-- Navigation Views -->
        <div>
          <div class="sidebar-section-title">
            <span>Views</span>
          </div>
          <ul class="nav-list" id="sidebar-views-list">
            <li class="nav-item active" data-view="kanban" id="nav-kanban">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="10" rx="1"/></svg>
              <span>Kanban Board</span>
            </li>
            <li class="nav-item" data-view="list" id="nav-list">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
              <span>List Table</span>
            </li>
            <li class="nav-item" data-view="timeline" id="nav-timeline">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h4M12 18h6"/></svg>
              <span>Sprint Timeline</span>
            </li>
            <li class="nav-item" data-view="analytics" id="nav-analytics">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
              <span>Sprint Analytics</span>
            </li>
            <li class="nav-item" data-view="team" id="nav-team">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <span>Team Workload</span>
            </li>
            <li class="nav-item" data-view="chat" id="nav-chat">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              <span>Project Lounge</span>
            </li>
          </ul>
        </div>

        <!-- Group Projects -->
        <div>
          <div class="sidebar-section-title">
            <span>Group Projects</span>
            <button id="btn-new-project" title="Create New Group Project (P)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
          <ul class="nav-list" id="sidebar-projects-list">
            <!-- Dynamically populated -->
          </ul>
        </div>

        <!-- Collaborators / Presence -->
        <div>
          <div class="sidebar-section-title">
            <span>Team Members</span>
          </div>
          <ul class="nav-list" id="sidebar-members-list">
            <!-- Dynamically populated -->
          </ul>
        </div>

        <!-- Workspace Utility -->
        <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border-subtle);">
          <button class="btn-ghost btn-sm" id="btn-reset-demo" style="width: 100%; justify-content: flex-start; color: var(--text-muted); font-size: 0.75rem;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            <span>Reset Demo Data</span>
          </button>
        </div>
      </div>

      <!-- Sidebar Footer (Active User Profile Card) -->
      <div class="sidebar-footer">
        <div class="current-user-card" id="active-user-trigger" title="Click to switch collaborator identity">
          <!-- Dynamically populated -->
        </div>
      </div>
    </aside>

    <!-- MAIN WRAPPER -->
    <main class="main-wrapper">
      <!-- TOP NAVIGATION BAR -->
      <header class="topbar">
        <div class="topbar-left">
          <div class="project-breadcrumbs">
            <span class="breadcrumb-root">Projects</span>
            <span class="breadcrumb-separator">/</span>
            <div class="project-title-container">
              <span class="current-project-title" id="topbar-project-title">Nexus Fintech App</span>
              <span class="project-key-tag" id="topbar-project-key">NTX</span>
            </div>
          </div>
          <button class="btn-ghost btn-sm" id="btn-project-settings" title="Project Settings & Members" style="padding: 0.25rem 0.5rem; color: var(--text-muted);">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>

        <!-- Center Search & Filter -->
        <div class="topbar-center">
          <div class="search-bar-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input 
              type="text" 
              class="search-input" 
              id="global-search-input" 
              placeholder="Search tasks, tags, or assignees..." 
              autocomplete="off"
            />
            <span class="search-kbd">Ctrl+K</span>
          </div>
        </div>

        <!-- Right Action Controls -->
        <div class="topbar-right">
          <!-- Collaborator Switcher Quick Action -->
          <button class="btn btn-secondary btn-sm" id="btn-switch-user-topbar" title="Switch Collaborator Profile">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
            <span>Switch User</span>
          </button>

          <!-- Sound FX Toggle -->
          <button class="btn-icon" id="btn-sound-toggle" title="Toggle Sound FX">
            <!-- Dynamically populated -->
          </button>

          <!-- Shortcuts Help Button -->
          <button class="btn-icon" id="btn-help-shortcuts" title="Keyboard Shortcuts (?)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          </button>

          <!-- Notifications Bell -->
          <button class="btn-icon" id="btn-notifications" title="Team Notifications">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </button>

          <!-- Theme Toggle -->
          <button class="btn-icon" id="btn-theme-toggle" title="Toggle Theme (Dark / Light)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>

          <!-- New Task Action -->
          <button class="btn btn-primary" id="btn-new-task" title="Create New Task (N)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>New Task</span>
          </button>
        </div>
      </header>

      <!-- VIEW TOOLBAR (Tabs & Filters) -->
      <div class="view-toolbar">
        <div class="view-tabs">
          <button class="view-tab active" data-view="kanban" id="tab-kanban">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="10" rx="1"/></svg>
            <span>Kanban</span>
          </button>
          <button class="view-tab" data-view="list" id="tab-list">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            <span>List</span>
          </button>
          <button class="view-tab" data-view="timeline" id="tab-timeline">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h4M12 18h6"/></svg>
            <span>Timeline</span>
          </button>
          <button class="view-tab" data-view="analytics" id="tab-analytics">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            <span>Analytics</span>
          </button>
          <button class="view-tab" data-view="team" id="tab-team">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>Workload</span>
          </button>
          <button class="view-tab" data-view="chat" id="tab-chat">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>Team Lounge</span>
          </button>
        </div>

        <div class="filter-group">
          <!-- Assignee Filter -->
          <select class="filter-select" id="filter-assignee-select" title="Filter by Assignee">
            <option value="all">All Assignees</option>
          </select>

          <!-- Priority Filter -->
          <select class="filter-select" id="filter-priority-select" title="Filter by Priority">
            <option value="all">All Priorities</option>
            <option value="urgent">Urgent</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
      </div>

      <!-- VIEWPORT (Dynamic View Injection) -->
      <section class="view-container" id="view-viewport" aria-label="Project Tasks Workspace">
        <!-- Injected via JavaScript Views -->
      </section>
    </main>
  </div>

  <!-- JavaScript Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
